<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFI Occupancy Detection</title>
    <script src="/js/vendor/tailwind.js"></script>
    <script defer src="/js/vendor/alpine.min.js"></script>
    <script src="/js/vendor/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        .app-header { flex-shrink: 0; }
        .app-main { flex: 1; min-height: 0; display: flex; overflow: hidden; }
        .col-left { width: 22rem; flex-shrink: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .col-right { flex: 1; min-width: 0; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; overflow: hidden; height: 100%; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100" x-data="app()" x-init="init()">

    <!-- Header -->
    <header class="app-header bg-gray-900 border-b border-gray-800 px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full" :class="connected ? 'bg-green-500' : 'bg-red-500'"></div>
            <h1 class="text-base font-semibold">BFI Occupancy Detection</h1>
            <span class="text-[0.7rem] px-2 py-0.5 rounded-full font-semibold"
                  :class="mode === 'live' ? 'bg-green-900 text-green-300' : 'bg-amber-900 text-amber-300'"
                  x-text="mode === 'live' ? 'LIVE' : 'REPLAY'"></span>
        </div>
        <div class="text-sm text-gray-400">
            Windows: <span x-text="totalWindows.toLocaleString()"></span>
        </div>
    </header>

    <!-- Main -->
    <div class="app-main">
        <!-- Left column -->
        <div class="col-left">
            <!-- Prediction Card -->
            <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 text-center">
                <div class="text-sm text-gray-400 mb-1">Current Prediction</div>
                <div class="text-4xl font-bold mb-2"
                     :class="current.prediction === 'Empty' ? 'text-cyan-400' : 'text-orange-400'"
                     x-text="current.prediction || '---'"></div>
                <div class="text-xl text-gray-300 mb-2"
                     x-text="current.confidence ? (current.confidence * 100).toFixed(1) + '%' : '---'"></div>

                <div x-show="current.ground_truth" class="text-xs mb-3"
                     :class="current.prediction && groundTruthLabel === current.prediction.toLowerCase() ? 'text-green-400' : 'text-red-400'">
                    <span x-text="current.prediction && groundTruthLabel === current.prediction.toLowerCase() ? '\u2713' : '\u2717'"></span>
                    Ground truth: <span class="font-semibold" x-text="current.ground_truth"></span>
                </div>
                <div x-show="!current.ground_truth" class="mb-3"></div>

                <div class="space-y-2">
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-cyan-400">P(Empty)</span>
                            <span x-text="current.p_empty != null ? (current.p_empty * 100).toFixed(1) + '%' : '---'"></span>
                        </div>
                        <div class="h-2.5 bg-gray-800 rounded-full overflow-hidden">
                            <div class="h-full bg-cyan-500 rounded-full transition-all duration-100"
                                 :style="'width:' + ((current.p_empty||0)*100) + '%'"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-orange-400">P(Occupied)</span>
                            <span x-text="current.p_occupied != null ? (current.p_occupied * 100).toFixed(1) + '%' : '---'"></span>
                        </div>
                        <div class="h-2.5 bg-gray-800 rounded-full overflow-hidden">
                            <div class="h-full bg-orange-500 rounded-full transition-all duration-100"
                                 :style="'width:' + ((current.p_occupied||0)*100) + '%'"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
                <h3 class="font-semibold mb-3">Controls</h3>

                <div class="flex gap-2 mb-3">
                    <button @click="switchMode('replay')"
                            class="flex-1 py-1.5 px-3 rounded-lg text-sm font-medium transition"
                            :class="mode==='replay' ? 'bg-amber-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'">Replay</button>
                    <button @click="switchMode('live')"
                            class="flex-1 py-1.5 px-3 rounded-lg text-sm font-medium transition"
                            :class="mode==='live' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'">Live</button>
                </div>

                <!-- LIVE -->
                <template x-if="mode === 'live'">
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">Interface</label>
                            <input type="text" x-model="liveInterface" placeholder="wlan0mon"
                                   class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300 font-mono">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">Device</label>
                            <select x-model="liveDeviceName" @change="
                                if (liveDeviceName==='M7') { liveDeviceStandard='AC'; liveDeviceConfig='3x1'; liveDeviceBw=80; liveDeviceMac='98:EE:94:99:D4:1A'; liveDeviceMimo='SU'; }
                                else if (liveDeviceName==='X7') { liveDeviceStandard='AX'; liveDeviceConfig='3x2'; liveDeviceBw=80; liveDeviceMac='9C:9E:D5:73:8A:2F'; liveDeviceMimo='SU'; }
                                else if (liveDeviceName==='X300') { liveDeviceStandard='AX'; liveDeviceConfig='3x2'; liveDeviceBw=80; liveDeviceMac='40:58:46:EA:91:FD'; liveDeviceMimo='SU'; }
                                else { liveDeviceStandard='AX'; liveDeviceConfig='3x2'; liveDeviceBw=80; liveDeviceMac=''; liveDeviceMimo='SU'; }
                            "
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300">
                                <option value="M7">POCO M7 Pro 5G (AC/3x1)</option>
                                <option value="X7">POCO X7 Pro (AX/3x2)</option>
                                <option value="X300">vivo X300 Pro (AX/3x2)</option>
                                <option value="custom">Custom...</option>
                            </select>
                        </div>
                        <template x-if="liveDeviceName === 'custom'">
                            <div class="space-y-2">
                                <div>
                                    <label class="text-xs text-gray-400 mb-1 block">MAC Address</label>
                                    <input type="text" x-model="liveDeviceMac" placeholder="AA:BB:CC:DD:EE:FF"
                                           class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300 font-mono">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-gray-400 mb-1 block">Standard</label>
                                        <select x-model="liveDeviceStandard" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300">
                                            <option value="AC">802.11ac</option>
                                            <option value="AX">802.11ax</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-xs text-gray-400 mb-1 block">MIMO</label>
                                        <select x-model="liveDeviceMimo" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300">
                                            <option value="SU">SU</option>
                                            <option value="MU">MU</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-gray-400 mb-1 block">Config</label>
                                        <select x-model="liveDeviceConfig" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300">
                                            <option value="3x1">3x1</option>
                                            <option value="3x2">3x2</option>
                                            <option value="3x3">3x3</option>
                                            <option value="4x1">4x1</option>
                                            <option value="4x2">4x2</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-xs text-gray-400 mb-1 block">Bandwidth</label>
                                        <select x-model.number="liveDeviceBw" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300">
                                            <option value="20">20 MHz</option>
                                            <option value="40">40 MHz</option>
                                            <option value="80">80 MHz</option>
                                            <option value="160">160 MHz</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <div class="flex gap-2">
                            <button @click="liveStart()" class="flex-1 py-1.5 rounded-lg text-sm font-semibold bg-green-600 text-white hover:bg-green-500 transition">&#9654; Start</button>
                            <button @click="liveStop()" class="flex-1 py-1.5 rounded-lg text-sm font-semibold bg-red-600 text-white hover:bg-red-500 transition">&#9632; Stop</button>
                            <button @click="liveReset()" class="py-1.5 px-3 rounded-lg text-sm font-semibold bg-gray-800 text-gray-400 hover:bg-gray-700 transition">&#8634;</button>
                        </div>
                        <div class="p-2 bg-gray-800 rounded-lg text-xs text-gray-400">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full" :class="liveCapturing ? 'bg-green-500 animate-pulse' : 'bg-gray-600'"></div>
                                <span x-text="liveCapturing ? 'Capturing on ' + liveInterface : 'Idle'"></span>
                            </div>
                            <div class="mt-1 text-gray-500">
                                <span x-text="liveDeviceMac"></span> &middot;
                                <span x-text="liveDeviceStandard + '/' + liveDeviceConfig + '/' + liveDeviceBw + 'MHz'"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- REPLAY -->
                <template x-if="mode === 'replay'">
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">File</label>
                            <select @change="selectFile($event.target.value)" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-300 font-mono">
                                <option value="all">All files</option>
                                <template x-for="f in availableFiles" :key="f">
                                    <option :value="f" x-text="f" :selected="selectedFile === f"></option>
                                </template>
                            </select>
                        </div>
                        <div class="flex justify-between text-xs text-gray-400">
                            <span x-text="formatTime(currentTime)"></span>
                            <span x-text="windowDisplay"></span>
                            <span x-text="formatTime(totalTime)"></span>
                        </div>
                        <input type="range" min="0" :max="totalTime * 1000 || 1" :value="currentTime * 1000"
                               @input="seekTo($event.target.value / 1000)"
                               class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-amber-500">
                        <div class="flex gap-2">
                            <button @click="togglePlay()" class="flex-1 py-1.5 rounded-lg text-sm font-semibold bg-gray-800 text-gray-400 hover:bg-gray-700 transition">
                                <span x-show="!playing">&#9654; Play</span>
                                <span x-show="playing">&#9208; Pause</span>
                            </button>
                            <button @click="seekTo(0)" class="py-1.5 px-3 rounded-lg text-sm font-semibold bg-gray-800 text-gray-400 hover:bg-gray-700 transition" title="Reset to start">&#9198;</button>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>Speed</span>
                                <span x-text="speed + 'x'"></span>
                            </div>
                            <div class="flex gap-1">
                                <template x-for="s in [1, 5, 10, 20, 50, 100]" :key="s">
                                    <button @click="setSpeed(s)" class="flex-1 py-1 rounded text-xs font-medium transition"
                                            :class="speed === s ? 'bg-amber-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'"
                                            x-text="s + 'x'"></button>
                                </template>
                            </div>
                        </div>
                        <div x-show="current.file" class="p-2 bg-gray-800 rounded-lg">
                            <div class="text-xs text-gray-400">Playing</div>
                            <div class="text-sm text-gray-200 font-mono truncate" x-text="current.file"></div>
                            <div class="text-xs text-gray-500" x-text="current.device + ' | ' + (current.ground_truth || '')"></div>
                        </div>
                    </div>
                </template>

                <!-- Video -->
                <template x-if="mode === 'replay'">
                    <div class="mt-3">
                        <button @click="showVideo = !showVideo" class="w-full py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700 transition"
                                x-text="showVideo ? 'Hide Video' : '+ Add Video'"></button>
                        <template x-if="showVideo">
                            <div class="mt-2 space-y-2">
                                <input type="text" x-model="videoSrc" placeholder="Video URL"
                                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 font-mono">
                                <video id="syncVideo" class="w-full rounded-lg" :src="videoSrc" @timeupdate="onVideoTimeUpdate()" controls></video>
                                <div class="flex gap-2 items-center">
                                    <span class="text-xs text-gray-400">Offset:</span>
                                    <input type="number" x-model.number="videoOffsetMs" placeholder="ms" class="w-16 bg-gray-800 border border-gray-700 rounded-lg px-2 py-1 text-xs text-gray-300">
                                    <span class="text-xs text-gray-500">ms</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- Right column -->
        <div class="col-right">
            <!-- Chart -->
            <div class="bg-gray-900 rounded-xl p-4 border border-gray-800" style="flex: 3; min-height: 0; display: flex; flex-direction: column;">
                <h3 class="font-semibold mb-3 flex-shrink-0">Prediction History</h3>
                <div style="flex: 1; min-height: 0; position: relative;">
                    <canvas id="historyChart" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
                </div>
                <!-- Inline metrics row -->
                <div class="grid grid-cols-4 gap-3 mt-3 flex-shrink-0">
                    <div class="text-center p-2 bg-gray-800 rounded-lg">
                        <div class="text-xl font-bold text-cyan-400" x-text="current.dist_empty ? current.dist_empty.toFixed(2) : '---'"></div>
                        <div class="text-xs text-gray-400">Dist (Empty)</div>
                    </div>
                    <div class="text-center p-2 bg-gray-800 rounded-lg">
                        <div class="text-xl font-bold text-orange-400" x-text="current.dist_occupied ? current.dist_occupied.toFixed(2) : '---'"></div>
                        <div class="text-xs text-gray-400">Dist (Occupied)</div>
                    </div>
                    <div class="text-center p-2 bg-gray-800 rounded-lg">
                        <div class="text-xl font-bold text-green-400" x-text="current.confidence ? (current.confidence * 100).toFixed(1) + '%' : '---'"></div>
                        <div class="text-xs text-gray-400">Confidence</div>
                    </div>
                    <div class="text-center p-2 bg-gray-800 rounded-lg">
                        <div class="text-xl font-bold"
                             :class="current.prediction && groundTruthLabel === current.prediction.toLowerCase() ? 'text-green-400' : 'text-red-400'"
                             x-text="current.prediction ? (groundTruthLabel === current.prediction.toLowerCase() ? 'Correct' : 'Wrong') : '---'"></div>
                        <div class="text-xs text-gray-400">Accuracy</div>
                    </div>
                </div>
            </div>

            <!-- Log: takes remaining space -->
            <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 flex-1 min-h-0 flex flex-col">
                <div class="flex items-center justify-between mb-2 flex-shrink-0">
                    <h3 class="font-semibold">System Log</h3>
                    <span class="text-xs text-gray-500" x-text="logEntries.length + ' entries'"></span>
                </div>
                <div class="flex-1 min-h-0 overflow-y-auto font-mono text-xs" x-ref="logContainer">
                    <template x-for="entry in logEntries" :key="entry.id">
                        <div class="flex gap-2 py-0.5 px-2 rounded"
                             :class="entry.level === 'error' ? 'bg-red-950/30' : 'bg-gray-800/30'">
                            <span class="text-gray-500 shrink-0" x-text="entry.time"></span>
                            <span class="shrink-0 w-10 text-center font-bold"
                                  :class="entry.level === 'error' ? 'text-red-400' : 'text-green-400'"
                                  x-text="entry.level.toUpperCase()"></span>
                            <span class="text-gray-300" x-text="entry.message"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
